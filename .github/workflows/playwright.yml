name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  playwright-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: Preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
        env:
          # The browser tests never reach the database, and the store tests start their own local
          # DynamoDB, so these only have to satisfy startup validation.
          AWS_REGION: us-east-1
          DDB_TABLE_NAME: wheel-ci
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          KV_REST_API_READ_ONLY_TOKEN: ${{ secrets.KV_REST_API_READ_ONLY_TOKEN }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_URL: ${{ secrets.KV_URL }}
          SOKETI_APP_ID: ${{ secrets.SOKETI_APP_ID }}
          SOKETI_SECRET: ${{ secrets.SOKETI_SECRET }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SOKETI_KEY: ${{ vars.NEXT_PUBLIC_SOKETI_KEY }}
          NEXT_PUBLIC_SOKETI_URL: ${{ vars.NEXT_PUBLIC_SOKETI_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
